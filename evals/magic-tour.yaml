  # 3. CIERRES DE PARQUES 2026 Y ALTERNATIVAS (5 casos ES/EN)
  # =========================================================================
  - id: closure_19_tayrona_febrero_es
    category: closure_dates
    language: es
    question: "Viajo a Santa Marta del 5 al 10 de febrero. ¿Está abierto el Parque Tayrona?"
    expected_intent: info
    must_contain_in_knowledge:
      - "1 al 15 de febrero"
      - "1 al 15 de junio"
      - "19 de octubre al 2 de noviembre"
    must_contain_in_reply:
      - "1 al 15 de febrero"
      - "cerrado"
      - "Minca"
    must_not_contain_in_reply:
      - "sí está abierto"
    simulated_llm_reply: >
      Del **1 al 15 de febrero** el Parque Nacional Natural Tayrona permanece **cerrado** por la jornada espiritual y ecológica `#RespiraTayrona` 🙏.
      Para tus fechas del 5 al 10 de febrero te recomendamos excelentes alternativas fuera del parque: **Minca** (café, cacao y cascadas), **Bunkuany** en la Sierra Nevada, **Día en Velero a Playa Inca Inca** o **Playa Blanca y Acuario**.

  - id: closure_20_tayrona_junio_es
    category: closure_dates
    language: es
    question: "¿En junio cierra el Parque Tayrona? Quiero ir el 8 de junio a Playa Cristal."
    expected_intent: info
    must_contain_in_knowledge:
      - "1 al 15 de junio"
    must_contain_in_reply:
      - "1 al 15 de junio"
      - "cerrado"
    must_not_contain_in_reply:
      - "puedes entrar el 8 de junio"
    simulated_llm_reply: >
      Sí, del **1 al 15 de junio** es el segundo cierre anual del Parque Tayrona (`#RespiraTayrona`), por lo que el 8 de junio Playa Cristal estará **cerrado** al público 🌿. Como alternativa de mar ese día podemos ofrecerte **Playa Inca Inca en Velero**, **Taganga y Playa Grande** o **Minca**.

  - id: closure_21_tayrona_octubre_noviembre_en
    category: closure_dates
    language: en
    question: "What are the Tayrona Park closure dates in October and November?"
    expected_intent: info
    must_contain_in_knowledge:
      - "19 de octubre al 2 de noviembre"
    must_contain_in_reply:
      - "October 19"
      - "November 2"
    must_not_contain_in_reply:
      - "open all October"
    simulated_llm_reply: >
      The third annual `#RespiraTayrona` closure runs from **October 19 to November 2** (inclusive) 🌿. During those days all Tayrona Park sectors are closed, and we recommend **Minca**, **Cerro Kennedy**, **Inca Inca Sailboat**, or **La Guajira**.

  - id: closure_22_ciudad_perdida_octubre_2026_es
    category: closure_dates
    language: es
    question: "¿Cuándo cierra Ciudad Perdida en 2026 y qué tour similar me recomiendan si viajo a mediados de octubre?"
    expected_intent: info
    must_contain_in_knowledge:
      - "1 al 31 de octubre de 2026"
      - "30 de octubre"
      - "Bunkuany"
    must_contain_in_reply:
      - "1 al 31 de octubre"
      - "Bunkuany"
    must_not_contain_in_reply:
      - "cierra en septiembre de 2026"
    simulated_llm_reply: >
      En el calendario oficial **2026**, Ciudad Perdida (Parque Arqueológico Teyuna) cierra del **1 al 31 de octubre de 2026** (las salidas se reanudan desde el **30 de octubre**) 🏔️.
      Si viajas a mediados de octubre, nuestra mejor alternativa arqueológica e indígena en la Sierra Nevada es **Bunkuany** (disponible en tours de 1, 2 o 3 días con comunidad Kogui) o **Cerro Kennedy (2 días)**.

  - id: closure_23_ciudad_perdida_septiembre_2026_en
    category: closure_dates
    language: en
    question: "Is Lost City (Ciudad Perdida) closed in September 2026 or October 2026?"
    expected_intent: info
