[project]
name = "maestro"
version = "0.1.0"
description = "Maestro - Asistente de WhatsApp con IA para agencias turísticas"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
